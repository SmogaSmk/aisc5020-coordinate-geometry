[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aisc5020-coordinate-geometry"
version = "0.1.0"
description = "Shared research scaffold for paired quadratic optimization experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
plots = ["matplotlib>=3.7,<4"]

[project.scripts]
coordinate-geometry-smoke = "coordinate_geometry.smoke:main"

[tool.setuptools.packages.find]
where = ["src"]
